---
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild for base-image security updates

permissions:
  contents: write         # upload the SBOM to releases
  packages: write         # push to ghcr.io
  id-token: write         # keyless cosign signing (Sigstore OIDC)
  security-events: write  # upload Trivy SARIF to code scanning

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE: jdc-execution-engine
  TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install linters
        run: pip install "yamllint>=1.38,<2" "ansible-lint>=26.9,<27"

      - name: Lint
        run: make lint

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # tags, for the image version label

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install ansible-builder
        run: pip install "ansible-builder>=3.1,<4"

      - name: Build
        run: make build REGISTRY=$REGISTRY TAG=$TAG

      - name: Labels
        run: make inspect REGISTRY=$REGISTRY TAG=$TAG | grep org.opencontainers

      - name: Smoke test (playbook + OpenTelemetry spans)
        run: make test REGISTRY=$REGISTRY TAG=$TAG

      - name: End-to-end (OTLP gRPC + HTTP to a real Collector, TRACEPARENT)
        run: make e2e REGISTRY=$REGISTRY TAG=$TAG

      - name: Keep e2e collector log on failure
        if: failure() && hashFiles('build/e2e.log') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-log
          path: build/e2e.log

      - name: Vulnerability report
        run: make sarif REGISTRY=$REGISTRY TAG=$TAG

      - name: Upload vulnerability report to code scanning
        if: always() && hashFiles('build/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: build/trivy.sarif
          category: trivy-image

      - name: Vulnerability gate (fixable CRITICAL)
        run: make scan REGISTRY=$REGISTRY TAG=$TAG

      - name: SBOM
        run: make sbom REGISTRY=$REGISTRY TAG=$TAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: build/sbom.cdx.json

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          make push REGISTRY=$REGISTRY TAG=$TAG
          extra=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then extra="latest"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then extra="${GITHUB_REF_NAME#v}"; fi
          for t in $extra; do
            podman tag "$REGISTRY/$IMAGE:$TAG" "$REGISTRY/$IMAGE:$t"
            podman push "$REGISTRY/$IMAGE:$t"
          done
          echo "IMAGE_REF=$REGISTRY/$IMAGE@$(cat build/digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        if: github.event_name != 'pull_request'

      - name: Sign image and attest SBOM
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate build/sbom.cdx.json "$IMAGE_REF"
          echo "Signed $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach SBOM to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/sbom.cdx.json "build/${IMAGE}-${GITHUB_REF_NAME#v}.sbom.cdx.json"
          gh release upload "$GITHUB_REF_NAME" "build/${IMAGE}-${GITHUB_REF_NAME#v}.sbom.cdx.json" --clobber \
            || echo "::warning::no release for $GITHUB_REF_NAME yet; SBOM is in the workflow artifacts"

[defaults]
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
# Send a trace per playbook run (one span per task/host) via OpenTelemetry
callbacks_enabled = community.general.opentelemetry

[callback_opentelemetry]
# Only active when this environment variable is "true". The image sets it to
# true; run with ANSIBLE_OPENTELEMETRY_ENABLED=false to switch tracing off.
enable_from_environment = ANSIBLE_OPENTELEMETRY_ENABLED
# Task arguments may contain secrets; set to false only if you are sure.
hide_task_arguments = True

[galaxy]
server_list = galaxy

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/

[ssh_connection]
pipelining = True

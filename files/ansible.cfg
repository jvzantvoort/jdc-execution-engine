[defaults]
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
# Tracing needs no settings here: the jdc_opentelemetry callback in
# /usr/share/ansible/plugins/callback loads automatically, so it also works
# when a project brings its own ansible.cfg.

[galaxy]
server_list = galaxy

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/

[ssh_connection]
pipelining = True

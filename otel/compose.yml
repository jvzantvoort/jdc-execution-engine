---
# Local tracing backend: OpenTelemetry Collector -> Jaeger.
#   make otel-up      # start collector (4317/4318) and Jaeger UI (16686)
#   make demo         # run tests/test.yml in the EE, exporting to the collector
#   open http://localhost:16686  (service "ansible")
name: jdc-otel
services:
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro,Z
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
networks:
  default:
    name: jdc-otel
